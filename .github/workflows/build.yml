name: Build installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            flags: --win
            cache: |
              ~\AppData\Local\electron\Cache
              ~\AppData\Local\electron-builder\Cache
          - name: macOS
            os: macos-latest
            flags: --mac --x64 --arm64
            cache: |
              ~/Library/Caches/electron
              ~/Library/Caches/electron-builder
          - name: Linux
            os: ubuntu-latest
            flags: --linux
            cache: |
              ~/.cache/electron
              ~/.cache/electron-builder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ${{ matrix.cache }}
          key: electron-${{ matrix.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ matrix.os }}-

      - run: npm ci

      - name: Typecheck and bundle
        run: npm run build

      - name: Package
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          for attempt in 1 2 3; do
            echo "::group::electron-builder attempt $attempt"
            if npx electron-builder ${{ matrix.flags }} --publish never; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            if [ "$attempt" -lt 3 ]; then
              delay=$((attempt * 20))
              echo "Packaging failed, retrying in ${delay}s (usually a dropped Electron download)"
              sleep "$delay"
            fi
          done
          echo "electron-builder failed after 3 attempts" >&2
          exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: devcleaner-${{ matrix.os }}
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Dev Cleaner $GITHUB_REF_NAME" \
            --generate-notes \
            --draft \
            artifacts/*/*
