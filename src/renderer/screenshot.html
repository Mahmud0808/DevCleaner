<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dev Cleaner</title>
    <script>
      const CATEGORY_TARGETS = {
        node: ['node_modules', 'dist', '.next', '.turbo', 'coverage'],
        python: ['.venv', '__pycache__', '.mypy_cache'],
        android: ['build', 'app/build', '.gradle', '.kotlin'],
        rust: ['target'],
        dotnet: ['bin', 'obj'],
        flutter: ['.dart_tool', 'build']
      }

      const TARGET_IDS = {
        node_modules: 'node_modules',
        dist: 'dist',
        '.next': 'next',
        '.turbo': 'turbo',
        coverage: 'coverage',
        '.venv': 'venv-dot',
        __pycache__: 'pycache',
        '.mypy_cache': 'mypy-cache',
        build: 'build',
        'app/build': 'app-build',
        '.gradle': 'gradle',
        '.kotlin': 'kotlin',
        target: 'target',
        bin: 'bin',
        obj: 'obj',
        '.dart_tool': 'dart_tool'
      }

      const PROJECTS = [
        ['node', 'storefront-web', 'storefront-web', [['node_modules', 918_552_000, 41_204], ['.next', 214_880_000, 3_412], ['dist', 38_400_000, 612]]],
        ['node', 'design-system', 'packages/design-system', [['node_modules', 604_210_000, 27_880], ['.turbo', 47_300_000, 1_204], ['coverage', 12_800_000, 340]]],
        ['node', 'admin-dashboard', 'admin-dashboard', [['node_modules', 512_400_000, 22_140], ['dist', 26_900_000, 418]]],
        ['rust', 'ingest-pipeline', 'services/ingest-pipeline', [['target', 1_284_000_000, 18_920]]],
        ['rust', 'wasm-codecs', 'wasm-codecs', [['target', 402_100_000, 6_204]]],
        ['android', 'field-app', 'mobile/field-app', [['app/build', 486_300_000, 9_880], ['.gradle', 212_400_000, 4_120], ['.kotlin', 18_900_000, 402]]],
        ['python', 'forecast-service', 'services/forecast-service', [['.venv', 388_700_000, 14_220], ['__pycache__', 8_400_000, 612], ['.mypy_cache', 22_100_000, 1_840]]],
        ['python', 'notebooks', 'research/notebooks', [['.venv', 274_500_000, 11_040]]],
        ['dotnet', 'Billing.Api', 'Billing.Api', [['bin', 96_400_000, 1_212], ['obj', 64_800_000, 2_408]]],
        ['flutter', 'courier-app', 'mobile/courier-app', [['.dart_tool', 142_600_000, 3_180], ['build', 318_200_000, 5_940]]]
      ]

      const LABELS = {
        node: 'Node.js / Web',
        python: 'Python',
        android: 'Android / Gradle',
        rust: 'Rust',
        dotnet: '.NET / C#',
        flutter: 'Flutter / Dart'
      }

      const ROOT = 'D:\\Projects'
      const now = Date.now()
      const SCALE = Number(new URLSearchParams(location.search).get('scale') ?? 1)

      function projectList() {
        if (SCALE <= 1) return PROJECTS
        const out = []
        for (let copy = 0; copy < SCALE; copy++) {
          for (const [categoryId, name, relativePath, items] of PROJECTS) {
            out.push([
              categoryId,
              copy === 0 ? name : `${name}-${copy}`,
              copy === 0 ? relativePath : `${relativePath}-${copy}`,
              items
            ])
          }
        }
        return out
      }

      function buildResult() {
        const byCategory = new Map()
        for (const [categoryId, name, relativePath, items] of projectList()) {
          const projectPath = `${ROOT}\\${relativePath.replace(/\//g, '\\')}`
          const built = items.map(([match, size, fileCount], index) => ({
            path: `${projectPath}\\${match.replace(/\//g, '\\')}`,
            name: match,
            kind: 'dir',
            categoryId,
            targetId: TARGET_IDS[match],
            projectPath,
            size,
            fileCount,
            modifiedAt: now - (index + 1) * 86_400_000 * 6
          }))
          const project = {
            id: `${projectPath}::${categoryId}`,
            path: projectPath,
            name,
            relativePath: relativePath.replace(/\//g, '\\'),
            categoryId,
            items: built,
            size: built.reduce((sum, item) => sum + item.size, 0)
          }
          if (!byCategory.has(categoryId)) byCategory.set(categoryId, [])
          byCategory.get(categoryId).push(project)
        }

        const groups = [...byCategory.entries()]
          .map(([categoryId, projects]) => ({
            categoryId,
            label: LABELS[categoryId],
            projects: projects.sort((a, b) => b.size - a.size),
            size: projects.reduce((sum, p) => sum + p.size, 0),
            itemCount: projects.reduce((sum, p) => sum + p.items.length, 0)
          }))
          .sort((a, b) => b.size - a.size)

        const items = groups.flatMap((g) => g.projects.flatMap((p) => p.items))
        return {
          root: ROOT,
          groups,
          totalSize: items.reduce((sum, i) => sum + i.size, 0),
          totalItems: items.length,
          totalProjects: groups.reduce((sum, g) => sum + g.projects.length, 0),
          scannedDirs: 18_442,
          durationMs: 6_820,
          cancelled: false,
          errors: []
        }
      }

      const ALL_CATEGORIES = ['node', 'python', 'android', 'dotnet', 'maven', 'go', 'rust', 'cpp', 'php', 'ios', 'flutter', 'ruby', 'unity', 'unreal', 'swift', 'terraform', 'elixir', 'godot', 'haskell', 'zig', 'os-junk']
      const OFF_BY_DEFAULT = { android: ['idea', 'captures'], dotnet: ['vs'], unreal: ['saved'], swift: ['swiftpm'] }

      const SETTINGS = {
        schemaVersion: 2,
        categories: Object.fromEntries(
          ALL_CATEGORIES.map((id) => [
            id,
            {
              enabled: true,
              targets: Object.fromEntries((OFF_BY_DEFAULT[id] ?? []).map((t) => [t, false]))
            }
          ])
        ),
        maxDepth: 12,
        followSymlinks: false,
        scanHiddenDirs: true,
        useTrash: false,
        confirmBeforeDelete: true,
        ignoredNames: [],
        protectedPaths: [],
        theme: 'dark',
        lastDirectory: ROOT
      }

      const noop = () => () => undefined

      window.api = {
        getSettings: async () => SETTINGS,
        saveSettings: async () => SETTINGS,
        resetSettings: async () => SETTINGS,
        getSettingsPath: async () => 'C:\\Users\\you\\AppData\\Roaming\\Dev Cleaner\\dev-cleaner-settings.json',
        getAppInfo: async () => ({
          version: '1.0.0',
          electron: '33.4.11',
          node: '20.18.3',
          chrome: '130.0.6723.191',
          platform: 'darwin'
        }),
        selectDirectory: async () => ROOT,
        pickFolder: async () => null,
        copyText: async () => undefined,
        validateDirectory: async () => true,
        scanDirectory: async () => buildResult(),
        cancelScan: async () => true,
        deleteItems: async () => ({
          deleted: [],
          failed: [],
          reclaimedBytes: 0,
          filesDeleted: 0,
          usedTrash: false,
          durationMs: 0
        }),
        revealPath: async () => undefined,
        openExternal: async () => undefined,
        onScanProgress: noop,
        onDeleteProgress: noop,
        onThemeChanged: noop
      }

      window.__DEVCLEANER_SCREENSHOT__ = true
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script type="module">
      const wait = (ms) => new Promise((done) => setTimeout(done, ms))

      function findButton(label) {
        return [...document.querySelectorAll('button')].find(
          (node) => node.textContent?.trim() === label
        )
      }

      await wait(400)
      document.documentElement.classList.add('dark')
      findButton('Scan this folder')?.click()
      await wait(600)
      const collapsed = [...document.querySelectorAll('[role="treeitem"][aria-expanded="false"]')]
      collapsed.find((row) => row.getAttribute('aria-level') === '2')?.click()
      await wait(200)
      document.body.dataset.ready = 'true'
    </script>
  </body>
</html>
